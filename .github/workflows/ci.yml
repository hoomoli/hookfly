name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: scripts/scan-repository-secrets.sh

  policy:
    needs: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/check-repository-test.sh
      - run: scripts/check-repository.sh
      - run: ruby scripts/check-container-workflow.rb

  go:
    needs: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: test -z "$(gofmt -l cmd internal migrations)"
      - run: go test ./...
      - run: go vet ./...

  frontend:
    needs: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build
      - run: node scripts/check-bundle-budget.mjs

  container-backend:
    needs: secret-scan
    runs-on: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify backend image locally
        if: ${{ !((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main') }}
        run: docker build -f Dockerfile.backend -t hookfly-backend:test .
      - name: Set up Buildx
        if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Restore backend build cache
        id: restore-build-cache
        if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/buildx-cache
          key: ${{ runner.os }}-buildx-${{ runner.arch }}-backend-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-${{ runner.arch }}-backend-
      - name: Build backend release archive
        if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile.backend
          platforms: ${{ github.event_name == 'workflow_dispatch' && 'linux/arm64' || 'linux/amd64' }}
          tags: hookfly-backend:candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.event_name == 'workflow_dispatch' && 'arm64' || 'amd64' }}
          outputs: type=docker,dest=/tmp/hookfly-backend.tar
          provenance: false
          sbom: false
          cache-from: ${{ steps.restore-build-cache.outputs.cache-matched-key != '' && 'type=local,src=/tmp/buildx-cache' || '' }}
          cache-to: type=local,dest=/tmp/buildx-cache-new,mode=max
      - name: Scan backend archive for secrets
        if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_IMAGE_CONFIG_SCANNERS: secret
        with:
          scan-type: image
          input: /tmp/hookfly-backend.tar
          scanners: secret
          exit-code: 1
          format: table
          output: /dev/null
          hide-progress: true
      - name: Scan backend archive for vulnerabilities and misconfigurations
        if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_IMAGE_CONFIG_SCANNERS: misconfig
        with:
          scan-type: image
          input: /tmp/hookfly-backend.tar
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
          format: table
      - name: Rotate approved backend build cache
        if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
        run: |
          rm -rf /tmp/buildx-cache
          mv /tmp/buildx-cache-new /tmp/buildx-cache
      - name: Save approved backend build cache
        if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/buildx-cache
          key: ${{ runner.os }}-buildx-${{ runner.arch }}-backend-${{ github.sha }}
      - name: Checksum backend release archive
        if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
        run: |
          cd /tmp
          sha256sum hookfly-backend.tar > hookfly-backend.tar.sha256
      - name: Upload backend release archive
        if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-image-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.event_name == 'workflow_dispatch' && 'arm64' || 'amd64' }}
          path: |
            /tmp/hookfly-backend.tar
            /tmp/hookfly-backend.tar.sha256
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  container-frontend:
    needs: secret-scan
    runs-on: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify frontend image locally
        if: ${{ !((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main') }}
        run: docker build -f web/Dockerfile -t hookfly-frontend:test web
      - name: Set up Buildx
        if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Restore frontend build cache
        id: restore-build-cache
        if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/buildx-cache
          key: ${{ runner.os }}-buildx-${{ runner.arch }}-frontend-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-${{ runner.arch }}-frontend-
      - name: Build frontend release archive
        if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./web
          file: ./web/Dockerfile
          platforms: ${{ github.event_name == 'workflow_dispatch' && 'linux/arm64' || 'linux/amd64' }}
          tags: hookfly-frontend:candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.event_name == 'workflow_dispatch' && 'arm64' || 'amd64' }}
          outputs: type=docker,dest=/tmp/hookfly-frontend.tar
          provenance: false
          sbom: false
          cache-from: ${{ steps.restore-build-cache.outputs.cache-matched-key != '' && 'type=local,src=/tmp/buildx-cache' || '' }}
          cache-to: type=local,dest=/tmp/buildx-cache-new,mode=max
      - name: Scan frontend archive for secrets
        if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_IMAGE_CONFIG_SCANNERS: secret
        with:
          scan-type: image
          input: /tmp/hookfly-frontend.tar
          scanners: secret
          exit-code: 1
          format: table
          output: /dev/null
          hide-progress: true
      - name: Scan frontend archive for vulnerabilities and misconfigurations
        if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_IMAGE_CONFIG_SCANNERS: misconfig
        with:
          scan-type: image
          input: /tmp/hookfly-frontend.tar
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
          format: table
      - name: Rotate approved frontend build cache
        if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
        run: |
          rm -rf /tmp/buildx-cache
          mv /tmp/buildx-cache-new /tmp/buildx-cache
      - name: Save approved frontend build cache
        if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/buildx-cache
          key: ${{ runner.os }}-buildx-${{ runner.arch }}-frontend-${{ github.sha }}
      - name: Checksum frontend release archive
        if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
        run: |
          cd /tmp
          sha256sum hookfly-frontend.tar > hookfly-frontend.tar.sha256
      - name: Upload frontend release archive
        if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-image-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.event_name == 'workflow_dispatch' && 'arm64' || 'amd64' }}
          path: |
            /tmp/hookfly-frontend.tar
            /tmp/hookfly-frontend.tar.sha256
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  publish-backend:
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    needs: [policy, go, frontend, container-backend, container-frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - name: Download scanned backend archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: backend-image-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.event_name == 'workflow_dispatch' && 'arm64' || 'amd64' }}
          path: /tmp/backend-image
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish scanned backend archive
        id: publish
        env:
          IMAGE_NAME: ghcr.io/hoomoli/hookfly-backend
        run: |
          set -euo pipefail
          cd /tmp/backend-image
          sha256sum --check hookfly-backend.tar.sha256
          docker load --input hookfly-backend.tar

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            arch=arm64
          else
            arch=amd64
          fi

          candidate_tag="candidate-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${arch}"
          source_image="hookfly-backend:${candidate_tag}"
          candidate_ref="${IMAGE_NAME}:${candidate_tag}"
          docker tag "$source_image" "$candidate_ref"
          docker push "$candidate_ref"
          digest=$(docker buildx imagetools inspect "$candidate_ref" --format '{{json .Manifest}}' | jq -er '.digest')
          if ! printf '%s\n' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "Invalid published digest: $digest" >&2
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Log out from GHCR
        if: always()
        run: |
          set -euo pipefail
          docker logout ghcr.io

  publish-frontend:
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    needs: [policy, go, frontend, container-backend, container-frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - name: Download scanned frontend archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-image-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.event_name == 'workflow_dispatch' && 'arm64' || 'amd64' }}
          path: /tmp/frontend-image
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish scanned frontend archive
        id: publish
        env:
          IMAGE_NAME: ghcr.io/hoomoli/hookfly-frontend
        run: |
          set -euo pipefail
          cd /tmp/frontend-image
          sha256sum --check hookfly-frontend.tar.sha256
          docker load --input hookfly-frontend.tar

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            arch=arm64
          else
            arch=amd64
          fi

          candidate_tag="candidate-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${arch}"
          source_image="hookfly-frontend:${candidate_tag}"
          candidate_ref="${IMAGE_NAME}:${candidate_tag}"
          docker tag "$source_image" "$candidate_ref"
          docker push "$candidate_ref"
          digest=$(docker buildx imagetools inspect "$candidate_ref" --format '{{json .Manifest}}' | jq -er '.digest')
          if ! printf '%s\n' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "Invalid published digest: $digest" >&2
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Log out from GHCR
        if: always()
        run: |
          set -euo pipefail
          docker logout ghcr.io

  promote-backend:
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    needs: [publish-backend, publish-frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate current main and promote backend digest
        id: promote
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_NAME: ghcr.io/hoomoli/hookfly-backend
          PUBLISHED_DIGEST: ${{ needs.publish-backend.outputs.digest }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            arch=arm64
            immutable_tag="${GITHUB_SHA}-arm64"
            floating_tag=latest-arm64
          else
            arch=amd64
            immutable_tag="$GITHUB_SHA"
            floating_tag=latest
          fi

          candidate_tag="candidate-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${arch}"
          docker buildx imagetools create --prefer-index=false \
            --tag "${IMAGE_NAME}:${immutable_tag}" \
            "${IMAGE_NAME}:${candidate_tag}@${PUBLISHED_DIGEST}"
          immutable_digest=$(docker buildx imagetools inspect "${IMAGE_NAME}:${immutable_tag}" --format '{{json .Manifest}}' | jq -er '.digest')
          test "$immutable_digest" = "$PUBLISHED_DIGEST"

          if current_sha=$(curl --fail --silent --show-error \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/commits/main" | jq -er '.sha'); then
            if [ "$current_sha" = "$GITHUB_SHA" ]; then
              docker buildx imagetools create --prefer-index=false \
                --tag "${IMAGE_NAME}:${floating_tag}" \
                "${IMAGE_NAME}:${candidate_tag}@${PUBLISHED_DIGEST}"
              floating_digest=$(docker buildx imagetools inspect "${IMAGE_NAME}:${floating_tag}" --format '{{json .Manifest}}' | jq -er '.digest')
              test "$floating_digest" = "$PUBLISHED_DIGEST"
            else
              echo "Skipping floating tag for stale run ${GITHUB_SHA}; current main is ${current_sha}."
            fi
          else
            echo "Skipping floating tag because current main could not be verified." >&2
          fi
      - name: Attest final backend digest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/hoomoli/hookfly-backend
          subject-digest: ${{ needs.publish-backend.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Log out from GHCR
        if: always()
        run: |
          set -euo pipefail
          docker logout ghcr.io

  promote-frontend:
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    needs: [publish-backend, publish-frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate current main and promote frontend digest
        id: promote
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_NAME: ghcr.io/hoomoli/hookfly-frontend
          PUBLISHED_DIGEST: ${{ needs.publish-frontend.outputs.digest }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            arch=arm64
            immutable_tag="${GITHUB_SHA}-arm64"
            floating_tag=latest-arm64
          else
            arch=amd64
            immutable_tag="$GITHUB_SHA"
            floating_tag=latest
          fi

          candidate_tag="candidate-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${arch}"
          docker buildx imagetools create --prefer-index=false \
            --tag "${IMAGE_NAME}:${immutable_tag}" \
            "${IMAGE_NAME}:${candidate_tag}@${PUBLISHED_DIGEST}"
          immutable_digest=$(docker buildx imagetools inspect "${IMAGE_NAME}:${immutable_tag}" --format '{{json .Manifest}}' | jq -er '.digest')
          test "$immutable_digest" = "$PUBLISHED_DIGEST"

          if current_sha=$(curl --fail --silent --show-error \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/commits/main" | jq -er '.sha'); then
            if [ "$current_sha" = "$GITHUB_SHA" ]; then
              docker buildx imagetools create --prefer-index=false \
                --tag "${IMAGE_NAME}:${floating_tag}" \
                "${IMAGE_NAME}:${candidate_tag}@${PUBLISHED_DIGEST}"
              floating_digest=$(docker buildx imagetools inspect "${IMAGE_NAME}:${floating_tag}" --format '{{json .Manifest}}' | jq -er '.digest')
              test "$floating_digest" = "$PUBLISHED_DIGEST"
            else
              echo "Skipping floating tag for stale run ${GITHUB_SHA}; current main is ${current_sha}."
            fi
          else
            echo "Skipping floating tag because current main could not be verified." >&2
          fi
      - name: Attest final frontend digest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/hoomoli/hookfly-frontend
          subject-digest: ${{ needs.publish-frontend.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Log out from GHCR
        if: always()
        run: |
          set -euo pipefail
          docker logout ghcr.io
